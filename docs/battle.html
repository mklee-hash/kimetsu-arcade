<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말의 호흡 배틀</title>
<meta name="theme-color" content="#0b0e22">
<meta name="description" content="같은 동기화 코드를 쓰는 대원끼리 실시간 일본어 퀴즈 대결! 빨리 맞힐수록 세게 벱니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0e22; --ink:#07081a; --paper:#efe6d2; --paper-dim:#b9b2a3;
  --blood:#d8343f; --wisteria:#a58bdc; --dawn:#f2b24a; --water:#4fb3ff; --leaf:#5ed27a;
  --cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --cut-s:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --brush:"Nanum Brush Script","Gowun Dodum",cursive;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#3a1d3a 0%,var(--night) 55%) fixed,var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0;font-weight:400}
.screen{display:none;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:scrIn .3s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brush{font-family:var(--brush)}
.jp{font-family:var(--jp);font-weight:700}
.eyebrow{color:var(--wisteria);font-size:14px;letter-spacing:.12em}
.hint{color:var(--paper-dim);font-size:14px}
.title{font-size:clamp(50px,14vw,78px);line-height:.95;text-shadow:0 0 26px rgba(216,52,63,.5)}
.title b{color:var(--blood);font-weight:400}
.btn{appearance:none;border:0;cursor:pointer;font-size:17px;line-height:1.25;color:var(--paper);background:rgba(239,230,210,.1);padding:12px 18px;min-height:52px;clip-path:var(--cut);
  box-shadow:inset 0 0 0 1px rgba(239,230,210,.22);display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;text-decoration:none;text-align:center}
.btn:hover{background:rgba(239,230,210,.18)}
.btn.primary{background:var(--blood);box-shadow:none;font-size:19px}
.btn.small{min-height:40px;padding:7px 12px;font-size:15px;clip-path:var(--cut-s)}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
a.arcade-back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#07081a;background:#f2b24a;padding:10px 16px 10px 12px;text-decoration:none;align-self:flex-start;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.panel{background:rgba(7,8,26,.72);clip-path:var(--cut);padding:14px 16px;box-shadow:inset 0 0 0 1px rgba(165,139,220,.25);display:flex;flex-direction:column;gap:10px}
.me{display:flex;gap:12px;align-items:center}
.me img{width:64px;height:64px;border-radius:50%}
.me b{font-size:20px}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.room{display:flex;gap:10px;align-items:center;background:rgba(239,230,210,.06);padding:8px 10px;clip-path:var(--cut-s)}
.room img{width:48px;height:48px;border-radius:50%}
.room .grow{flex:1}
.board{width:100%;border-collapse:collapse;font-size:15px}
.board td{padding:6px 4px;border-bottom:1px solid rgba(239,230,210,.1)}
.board td:last-child{text-align:right;color:var(--dawn)}
.board img{width:30px;height:30px;border-radius:50%;vertical-align:middle;margin-right:6px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* battle */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.fighter img{width:min(28vw,120px);height:min(28vw,120px);border-radius:50%;background:rgba(239,230,210,.06);transition:transform .15s}
.fighter.opp img{transform:scaleX(-1)}
.fighter .nm{font-size:15px;font-weight:700}
.hp{width:100%;height:14px;background:rgba(239,230,210,.12);border-radius:7px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5ed27a,#c8f06a);transition:width .5s}
.hp.low i{background:linear-gradient(90deg,#d8343f,#ff7a2f)}
.hpn{font-size:12px;color:var(--paper-dim)}
.vs{font-family:var(--brush);font-size:44px;color:var(--blood)}
.fighter.hit img{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-6deg);filter:brightness(1.8) saturate(0)}50%{transform:translateX(8px) rotate(4deg)}}
.fighter.opp.hit img{animation:hitO .5s}
@keyframes hitO{0%,100%{transform:scaleX(-1)}20%{transform:scaleX(-1) translateX(-8px) rotate(-6deg);filter:brightness(1.8) saturate(0)}50%{transform:scaleX(-1) translateX(8px) rotate(4deg)}}
.dmg{position:absolute;top:20%;font-size:28px;font-weight:700;color:#ff5a5a;text-shadow:0 2px 0 #000;animation:dmg 1.1s ease-out both;pointer-events:none}
@keyframes dmg{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
.slash{position:absolute;inset:10% -10%;pointer-events:none;background:linear-gradient(135deg,transparent 45%,#fff 49%,#ffe9a0 51%,transparent 55%);animation:slash .35s ease-out both}
@keyframes slash{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0);opacity:.2}}
.round{text-align:center;font-size:14px;color:var(--wisteria)}
.timer{height:8px;background:rgba(239,230,210,.12);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--dawn);width:100%}
.q{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:120px;justify-content:center}
.q .big{font-family:var(--jp);font-weight:700;font-size:clamp(32px,10vw,46px);line-height:1.2}
.q .pr{color:var(--dawn);font-size:20px;font-weight:700}
.q .ko{font-size:24px}
.q .ask{font-size:14px;color:var(--wisteria)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;border:0;cursor:pointer;color:var(--paper);background:rgba(239,230,210,.08);clip-path:var(--cut-s);box-shadow:inset 0 0 0 1px rgba(239,230,210,.2);
  padding:10px 6px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;line-height:1.25;touch-action:manipulation}
.opt .o-jp{font-family:var(--jp);font-weight:700;font-size:21px}
.opt .o-pr{font-size:13px;color:var(--dawn)}
.opt.ok{background:rgba(94,210,122,.35);box-shadow:inset 0 0 0 2px var(--leaf)}
.opt.no{background:rgba(216,52,63,.35);box-shadow:inset 0 0 0 2px var(--blood)}
.opt.pick{box-shadow:inset 0 0 0 3px var(--dawn)}
.opt:disabled{cursor:default}
.status{text-align:center;min-height:2.6em;font-size:16px}
.status b{color:var(--dawn)}
.count{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,8,26,.7);font-family:var(--brush);font-size:120px;color:var(--dawn);z-index:20}
.result{text-align:center;align-items:center}
.result .big{font-size:64px;line-height:1}
.result img{width:140px;height:140px;border-radius:50%}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="screen" id="scr-lobby" aria-labelledby="lobby-title">
  <div class="wrap">
    <a class="arcade-back" href="index.html"><span aria-hidden="true">←</span>아케이드 홈</a>
    <div>
      <p class="eyebrow">실시간 일본어 대결</p>
      <h1 class="title brush" id="lobby-title">말의 호흡 <b>배틀</b></h1>
    </div>
    <div class="panel" id="need" hidden></div>
    <div id="lobby-main" hidden>
      <div class="wrap">
        <div class="panel">
          <div class="me" id="me"></div>
          <p class="hint">같은 문제를 동시에 풀어요. 맞히면 상대를 베고, <b>빨리 맞힐수록 더 세게</b> 벱니다! 체력이 먼저 0이 되거나 10문제가 끝나면 승부가 나요.</p>
          <button class="btn primary" id="create" type="button">⚔️ 대결방 만들기</button>
        </div>
        <div class="panel">
          <h3>🔥 지금 기다리는 대원</h3>
          <ul class="rooms" id="rooms"></ul>
          <p class="hint" id="rooms-empty">아직 아무도 없어요. 대결방을 만들고 가족에게 알려 주세요!</p>
        </div>
        <div class="panel">
          <h3>🏆 우리 대원 전적</h3>
          <table class="board"><tbody id="board"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="screen" id="scr-wait" aria-label="상대 기다리기">
  <div class="wrap" style="align-items:center;text-align:center;padding-top:10vh">
    <img id="wait-face" width="140" height="140" alt="" style="border-radius:50%">
    <h2 class="brush" style="font-size:44px">상대를 기다리는 중 <span class="spin">⏳</span></h2>
    <p class="hint">같은 동기화 코드를 쓰는 대원이 「말의 호흡 배틀」에 들어오면 내 방이 보여요.</p>
    <button class="btn" id="cancel" type="button">방 닫기</button>
  </div>
</section>

<section class="screen" id="scr-battle" aria-label="대결">
  <div class="wrap">
    <div class="arena">
      <div class="fighter" id="f-me"><img alt=""><span class="nm"></span><div class="hp"><i></i></div><span class="hpn"></span></div>
      <div class="vs">VS</div>
      <div class="fighter opp" id="f-opp"><img alt=""><span class="nm"></span><div class="hp"><i></i></div><span class="hpn"></span></div>
    </div>
    <div class="round" id="round"></div>
    <div class="timer" aria-hidden="true"><i id="timer"></i></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</section>

<section class="screen" id="scr-result" aria-label="결과">
  <div class="wrap result" id="result"></div>
</section>

<div class="count" id="count" hidden></div>

<script src="kchars.js?v=20261009010326"></script>
<script src="kprofile.js?v=20261009010326"></script>
<script src="ksync.js?v=20261009010326"></script>
<script src="nihongo-data.js?v=20261009010326"></script>
<script>
(() => {
'use strict';
const KS = window.KSync, KP = window.KProfile, D = window.NIHONGO, CHS = D.chapters;
const KC = (window.KChars && typeof KChars.bustDataURL === 'function') ? window.KChars : null;
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const ROOT = 'kimetsu-arcade:';
const N_Q = 10, MAX_HP = 100, Q_TIME = 10000, POLL = 700, STALE = 20000;
const faceCache = {};
function face(id, px, expr) {
  const k = id + px + (expr || ''); if (faceCache[k] != null) return faceCache[k];
  let u = ''; try { if (KC && KC.byId(id)) u = KC.bustDataURL(id, px, { expr: expr || 'smile' }) || ''; } catch (e) { u = ''; }
  return (faceCache[k] = u);
}
function setFace(img, id, px, expr) { const u = face(id || 'tanjiro', px * 2, expr); if (u) img.src = u; }
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- who am I ---------- */
function prefixOf(p) { return !p || p.legacy ? ROOT : ROOT + 'u:' + p.id + ':'; }
function readJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function clearedOf(p) { const s = readJSON(prefixOf(p) + 'nihongo:save', null); return s && s.stars ? Object.keys(s.stars).filter(k => s.stars[k] > 0).length : 0; }
function me() {
  if (window.__BATTLE_ME) return window.__BATTLE_ME;          // test hook
  const p = KP && KP.current(); if (!p) return null;
  return { pid: p.id.replace(/[^a-z0-9]/gi, ''), name: p.name, avatar: p.avatar, cleared: clearedOf(p), legacy: !!p.legacy, id: p.id };
}
function recordKey(p) { return prefixOf(p) + 'battle:record'; }
function addRecord(res) {
  const m = me(); if (!m) return;
  const k = recordKey(m.legacy ? { legacy: true } : { id: m.id || m.pid }), r = readJSON(k, { w: 0, l: 0, d: 0, streak: 0 });
  r[res]++; r.streak = res === 'w' ? (r.streak || 0) + 1 : 0;
  try { localStorage.setItem(k, JSON.stringify(r)); } catch (e) { /* storage off */ }
  if (KS && KS.syncNow) KS.syncNow({ silent: true });
}

/* ---------- Firestore REST (fields are JSON strings) ---------- */
async function fsGet(path) {
  const r = await fetch(KS.base() + path, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('서버 응답 ' + r.status);
  const j = await r.json(), out = {};
  const f = (j && j.fields) || {};
  Object.keys(f).forEach(k => { const s = f[k].stringValue; if (s) { try { out[k] = JSON.parse(s); } catch (e) { /* skip */ } } });
  return out;
}
async function fsSet(path, obj) {
  const keys = Object.keys(obj);
  const qs = keys.map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  const body = { fields: {} };
  keys.forEach(k => { body.fields[k] = { stringValue: obj[k] == null ? '' : JSON.stringify(obj[k]) }; });
  const r = await fetch(KS.base() + path + '?' + qs, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('저장 실패 ' + r.status);
}

/* ---------- sound / voice ---------- */
let AC = null;
function tone(f, t0, d, type, v) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || 0.14, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) { /* no audio */ }
}
const sfx = {
  ok() { tone(784, 0, 0.12, 'triangle'); tone(1175, 0.08, 0.2, 'triangle'); },
  no() { tone(200, 0, 0.25, 'square', 0.06); },
  slash() { tone(1400, 0, 0.08, 'sawtooth', 0.08); tone(300, 0.05, 0.25, 'triangle', 0.15); },
  tick() { tone(880, 0, 0.05, 'sine', 0.08); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.3, 'triangle', 0.13)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, i * 0.15, 0.35, 'triangle', 0.1)); }
};
let jaVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null; } catch (e) { /* */ } }
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { /* */ } }
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { /* */ } }

/* ---------- screens ---------- */
function go(n) { ['lobby', 'wait', 'battle', 'result'].forEach(x => $('scr-' + x).classList.toggle('active', x === n)); window.scrollTo(0, 0); }

/* ---------- questions: the host picks them (avoiding recent ones) and sends them to the guest ---------- */
const RECENT_KEY = ROOT + 'battle:recent';   // shared by the whole family (synced)
function buildQuestions(upto) {
  const pool = [];
  CHS.slice(0, upto).forEach(c => {
    c.words.forEach(w => pool.push({ jp: w[0], kana: w[1], ko: w[2] }));
    c.lines.forEach(l => { if (l[0].split('/').length <= 3) pool.push({ jp: l[0].replace(/\//g, ''), kana: l[1], ko: l[2] }); });
  });
  pool.forEach(p => { p.pron = D.pron(p.kana); });
  const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const recent = new Set(readJSON(RECENT_KEY, []));
  let fresh = pool.filter(p => !recent.has(p.jp));
  if (fresh.length < N_Q) fresh = pool;                       // everything seen lately: start over
  const order = shuf(fresh.slice()), qs = [], types = shuf(['meaning', 'meaning', 'meaning', 'reverse', 'reverse', 'reverse', 'listen', 'listen', 'listen', 'listen']);
  for (let i = 0; i < N_Q && i < order.length; i++) {
    const it = order[i], type = types[i % types.length], field = type === 'meaning' ? 'ko' : 'jp';
    const used = new Set([it[field]]), ds = [];
    for (const x of shuf(pool.slice())) { if (ds.length >= 3) break; if (!used.has(x[field])) { used.add(x[field]); ds.push(x); } }
    qs.push({ it, type, opts: shuf([it].concat(ds)) });
  }
  const keep = qs.map(q => q.it.jp).concat(readJSON(RECENT_KEY, [])).slice(0, Math.max(40, Math.floor(pool.length * 0.7)));
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(keep)); } catch (e) { /* storage off */ }
  return qs;
}

/* ---------- lobby ---------- */
let lobbyTimer = 0;
function family() { return KS && KS.code ? KS.code() : ''; }
function renderBoard() {
  const tb = $('board'); tb.textContent = '';
  const rows = (KP ? KP.list() : []).map(p => ({ p, r: readJSON(recordKey(p), { w: 0, l: 0, d: 0 }) }))
    .sort((a, b) => (b.r.w - a.r.w) || (a.r.l - b.r.l));
  rows.forEach(({ p, r }) => {
    const tr = el('tr'), a = el('td'), im = el('img'); setFace(im, p.avatar, 30); im.alt = '';
    a.append(im, p.name); const c = el('td', null, r.w + '승 ' + r.l + '패' + (r.d ? ' ' + r.d + '무' : ''));
    tr.append(a, c); tb.appendChild(tr);
  });
  if (!rows.length) { const tr = el('tr'); tr.appendChild(el('td', null, '아직 기록이 없어요')); tb.appendChild(tr); }
}
async function refreshRooms() {
  const m = me(), fam = family(); if (!m || !fam) return;
  let lob = null;
  try { lob = await fsGet('lobby/' + fam); } catch (e) { $('rooms-empty').textContent = '서버에 연결할 수 없어요. 인터넷을 확인해 주세요.'; $('rooms-empty').hidden = false; return; }
  const box = $('rooms'); box.textContent = '';
  const now = Date.now(), list = Object.keys(lob || {}).map(k => lob[k]).filter(r => r && r.rid && r.pid !== m.pid && now - r.t < 60000 && (!r.game || r.game === 'quiz'));
  list.forEach(r => {
    const li = el('li', 'room'), im = el('img'); setFace(im, r.avatar, 48); im.alt = '';
    const t = el('div', 'grow'); t.append(el('b', null, r.name)); t.append(el('div', 'hint', '대결 상대를 기다리고 있어요!'));
    const b = el('button', 'btn small primary', '도전! ⚔️'); b.type = 'button';
    b.addEventListener('click', () => joinRoom(r));
    li.append(im, t, b); box.appendChild(li);
  });
  $('rooms-empty').textContent = '아직 아무도 없어요. 대결방을 만들고 가족에게 알려 주세요!';
  $('rooms-empty').hidden = list.length > 0;
}
function openLobby() {
  go('lobby'); clearInterval(lobbyTimer);
  const need = $('need'), main = $('lobby-main'), m = me();
  let why = '';
  if (!KS || !KS.configured()) why = '실시간 대결은 서버(Firebase) 설정이 끝나야 쓸 수 있어요. 어른에게 부탁해 주세요!';
  else if (!family()) why = '아케이드 홈의 「☁️ 기록 동기화」를 먼저 켜 주세요. 같은 동기화 코드를 쓰는 대원끼리 대결할 수 있어요.';
  else if (!m) why = '아케이드 홈에서 「누가 할까요?」에 이름을 먼저 등록해 주세요.';
  need.hidden = !why; main.hidden = !!why;
  if (why) { need.textContent = ''; need.append(el('h3', null, '대결 준비가 필요해요'), el('p', null, why)); return; }
  const box = $('me'); box.textContent = '';
  const im = el('img'); setFace(im, m.avatar, 64); im.alt = '';
  const r = readJSON(recordKey(m.legacy ? { legacy: true } : { id: m.id || m.pid }), { w: 0, l: 0, d: 0, streak: 0 });
  const t = el('div'); t.append(el('b', null, m.name), el('div', 'hint', r.w + '승 ' + r.l + '패' + (r.streak >= 2 ? ' · 🔥 ' + r.streak + '연승 중' : '')));
  box.append(im, t);
  renderBoard(); refreshRooms();
  lobbyTimer = setInterval(refreshRooms, 2500);
}

/* ---------- room setup ---------- */
let G = null;   // current match
function rid() { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return family() + '-' + s; }
async function createRoom() {
  const m = me(), fam = family(); if (!m || !fam) return;
  clearInterval(lobbyTimer);
  const id = rid();
  const who = { pid: m.pid, name: m.name, avatar: m.avatar, cleared: m.cleared };
  try {
    await fsSet('rooms/' + id, { meta: { game: 'quiz', n: N_Q, host: who, created: Date.now() }, hs: { a: [], t: Date.now() } });
    await fsSet('lobby/' + fam, { ['r_' + m.pid]: { rid: id, pid: m.pid, name: m.name, avatar: m.avatar, t: Date.now(), game: 'quiz' } });
  } catch (e) { alert('방을 만들 수 없어요: ' + e.message); openLobby(); return; }
  G = { id, host: true, mine: 'hs', theirs: 'gs', me: who, closed: false };
  setFace($('wait-face'), m.avatar, 140);
  go('wait');
  let beat = 0;
  while (G && !G.closed && G.id === id) {
    await wait(1000);
    if (!G || G.closed) return;
    let room = null; try { room = await fsGet('rooms/' + id); } catch (e) { continue; }
    if (room && room.gs && room.gs.who) {
      G.opp = room.gs.who;
      try { await fsSet('lobby/' + fam, { ['r_' + m.pid]: null }); } catch (e) { /* stale entry expires */ }
      const upto = Math.min(CHS.length, Math.max(6, Math.min(who.cleared || 0, G.opp.cleared || 0) + 3));
      G.qs = buildQuestions(upto);
      try { await fsSet('rooms/' + id, { meta: Object.assign({}, room.meta, { qs: G.qs }) }); } catch (e) { alert('문제를 보내지 못했어요. 다시 해 주세요.'); cancelRoom(); return; }
      startMatch();
      return;
    }
    if (++beat % 10 === 0) { try { await fsSet('lobby/' + fam, { ['r_' + m.pid]: { rid: id, pid: m.pid, name: m.name, avatar: m.avatar, t: Date.now(), game: 'quiz' } }); } catch (e) { /* retry later */ } }
  }
}
async function cancelRoom() {
  const m = me(); if (G) G.closed = true;
  try { if (m) await fsSet('lobby/' + family(), { ['r_' + m.pid]: null }); } catch (e) { /* expires */ }
  G = null; openLobby();
}
async function joinRoom(entry) {
  const m = me(); if (!m) return;
  clearInterval(lobbyTimer);
  let room = null;
  try { room = await fsGet('rooms/' + entry.rid); } catch (e) { /* */ }
  if (!room || !room.meta || (room.gs && room.gs.who)) { alert('이미 시작했거나 없어진 방이에요.'); openLobby(); return; }
  const who = { pid: m.pid, name: m.name, avatar: m.avatar, cleared: m.cleared };
  try { await fsSet('rooms/' + entry.rid, { gs: { who, a: [], t: Date.now() } }); } catch (e) { alert('들어갈 수 없어요: ' + e.message); openLobby(); return; }
  G = { id: entry.rid, host: false, mine: 'gs', theirs: 'hs', me: who, opp: room.meta.host, closed: false };
  for (let k = 0; k < 40 && !G.qs; k++) {            // wait for the host to send today's questions
    await wait(600);
    try { const r = await fsGet('rooms/' + entry.rid); if (r && r.meta && r.meta.qs) G.qs = r.meta.qs; } catch (e) { /* retry */ }
  }
  if (!G.qs) { alert('상대와 연결이 끊겼어요.'); G = null; openLobby(); return; }
  startMatch();
}

/* ---------- match ---------- */
function fighter(id, who, hp) {
  const f = $(id); setFace(f.querySelector('img'), who.avatar, 120, 'normal');
  f.querySelector('.nm').textContent = who.name; setHP(id, hp);
}
function setHP(id, hp) {
  const f = $(id), v = Math.max(0, hp);
  f.querySelector('.hp i').style.width = v + '%'; f.querySelector('.hp').classList.toggle('low', v <= 30);
  f.querySelector('.hpn').textContent = '체력 ' + v;
}
function hitFx(id, dmg) {
  const f = $(id); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
  const s = el('div', 'slash'); f.appendChild(s); setTimeout(() => s.remove(), 400);
  const d = el('div', 'dmg', '-' + dmg); f.appendChild(d); setTimeout(() => d.remove(), 1100);
  sfx.slash();
}
const damage = a => a && a.ok ? 8 + Math.round(12 * Math.max(0, 1 - a.ms / Q_TIME)) : 0;
async function pushMine() {
  try { await fsSet('rooms/' + G.id, { [G.mine]: { who: G.me, a: G.answers, t: Date.now() } }); } catch (e) { /* retried on next push / heartbeat */ }
}
async function waitOpponent(i) {
  let lastBeat = Date.now();
  while (true) {
    let room = null; try { room = await fsGet('rooms/' + G.id); } catch (e) { /* keep trying */ }
    const th = room && room[G.theirs];
    if (th && th.a && th.a[i]) return th.a[i];
    if (th && th.t && th.t !== G.lastT) { G.lastT = th.t; G.seenLocal = Date.now(); }
    if (Date.now() - G.seenLocal > STALE + Q_TIME) return null;          // opponent closed the game
    if (Date.now() - lastBeat > 4000) { lastBeat = Date.now(); pushMine(); }   // heartbeat
    await wait(POLL);
  }
}
async function startMatch() {
  G.answers = []; G.hp = { me: MAX_HP, opp: MAX_HP }; G.seenLocal = Date.now();
  fighter('f-me', G.me, MAX_HP); fighter('f-opp', G.opp, MAX_HP);
  $('q').textContent = ''; $('opts').textContent = ''; $('status').textContent = '';
  go('battle');
  const c = $('count'); c.hidden = false;
  for (const t of ['3', '2', '1', '시작!']) { c.textContent = t; sfx.tick(); await wait(800); }
  c.hidden = true;
  for (let i = 0; i < G.qs.length; i++) {
    const mine = await askQuestion(i);
    G.answers[i] = mine; pushMine();
    $('status').innerHTML = mine.ok ? '정답! <b>' + (mine.ms / 1000).toFixed(1) + '초</b> · 상대를 기다려요…' : '아쉬워요! 상대를 기다려요…';
    const theirs = await waitOpponent(i);
    if (!theirs) { finish('left'); return; }
    await reveal(i, mine, theirs);
    if (G.hp.me <= 0 || G.hp.opp <= 0) break;
  }
  finish();
}
function askQuestion(i) {
  return new Promise(resolve => {
    const q = G.qs[i], it = q.it, box = $('q'), opts = $('opts');
    window.__battleQ = q;   // read by the automated test
    $('round').textContent = (i + 1) + ' / ' + G.qs.length + ' 번째 문제';
    $('status').textContent = '';
    box.textContent = ''; opts.textContent = '';
    if (q.type === 'meaning') { box.append(el('div', 'ask', '무슨 뜻일까요?'), el('div', 'big', it.jp), el('div', 'pr', '발음 ' + it.pron)); say(it.jp); }
    else if (q.type === 'listen') {
      const lb = el('button', 'btn small', '🔊 다시 듣기'); lb.type = 'button'; lb.addEventListener('click', () => say(it.jp));
      box.append(el('div', 'ask', '잘 듣고 들린 말을 골라요!'), el('div', 'ko', '👂'), lb); say(it.jp);
    }
    else box.append(el('div', 'ask', '일본어로 뭐라고 할까요?'), el('div', 'ko', it.ko));
    const t0 = performance.now(); let done = false;
    const bar = $('timer');
    const tick = () => { if (done) return; const f = 1 - (performance.now() - t0) / Q_TIME; bar.style.width = Math.max(0, f * 100) + '%'; if (f <= 0) end(null); else requestAnimationFrame(tick); };
    function end(pick, btn) {
      if (done) return; done = true;
      const ms = Math.round(performance.now() - t0), ok = !!pick && pick.jp === it.jp;
      opts.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b._it.jp === it.jp) b.classList.add('ok'); });
      if (btn) btn.classList.add(ok ? 'pick' : 'no');
      if (ok) sfx.ok(); else sfx.no();
      resolve({ ok, ms: Math.min(ms, Q_TIME) });
    }
    q.opts.forEach(o => {
      const b = el('button', 'opt'); b.type = 'button'; b._it = o;
      if (q.type === 'meaning') b.textContent = o.ko; else b.append(el('span', 'o-jp', o.jp), el('span', 'o-pr', o.pron));
      b.addEventListener('click', () => end(o, b));
      opts.appendChild(b);
    });
    requestAnimationFrame(tick);
  });
}
async function reveal(i, mine, theirs) {
  const dMe = damage(mine), dOpp = damage(theirs);
  const lines = [];
  lines.push('나: ' + (mine.ok ? '정답 ' + (mine.ms / 1000).toFixed(1) + '초' : '틀림'));
  lines.push(G.opp.name + ': ' + (theirs.ok ? '정답 ' + (theirs.ms / 1000).toFixed(1) + '초' : '틀림'));
  $('status').innerHTML = lines.map(l => l.replace(/정답/, '<b>정답</b>')).join('<br>');
  // the faster correct answer strikes first
  const order = [];
  if (dMe) order.push(['opp', dMe, mine.ms]);
  if (dOpp) order.push(['me', dOpp, theirs.ms]);
  order.sort((a, b) => a[2] - b[2]);
  for (const [who, d] of order) {
    G.hp[who] -= d; setHP(who === 'me' ? 'f-me' : 'f-opp', G.hp[who]); hitFx(who === 'me' ? 'f-me' : 'f-opp', d);
    await wait(650);
    if (G.hp.me <= 0 || G.hp.opp <= 0) break;
  }
  await wait(order.length ? 1000 : 1500);
}
function finish(why) {
  const r = $('result'); r.textContent = '';
  let res;
  if (why === 'left') res = 'w';
  else if (G.hp.me === G.hp.opp) res = 'd';
  else res = G.hp.me > G.hp.opp ? 'w' : 'l';
  addRecord(res);
  if (res === 'w') sfx.win(); else sfx.lose();
  const im = el('img'); setFace(im, G.me.avatar, 140, res === 'l' ? 'hurt' : 'smile'); im.alt = '';
  r.append(el('p', 'eyebrow', '말의 호흡 배틀'),
    el('div', 'big brush', res === 'w' ? '승리!' : res === 'l' ? '아쉬운 패배' : '무승부'), im);
  if (why === 'left') r.append(el('p', null, G.opp.name + '이(가) 대결을 떠났어요. 이긴 걸로 할게요!'));
  else r.append(el('p', null, '내 체력 ' + Math.max(0, G.hp.me) + ' · ' + G.opp.name + ' 체력 ' + Math.max(0, G.hp.opp)));
  r.append(el('p', 'hint', res === 'l' ? '말의 호흡에서 수련하고 다시 도전해요!' : '빨리 맞힐수록 더 세게 벨 수 있어요.'));
  const row = el('div', 'btn-row'); row.style.width = '100%';
  const again = el('button', 'btn primary', '⚔️ 다시 대결하기'); again.type = 'button'; again.addEventListener('click', () => { G = null; openLobby(); });
  const learn = el('a', 'btn', '📖 말의 호흡 수련'); learn.href = 'nihongo.html';
  row.append(again, learn); r.appendChild(row);
  G.closed = true;
  go('result');
}

$('create').addEventListener('click', createRoom);
$('cancel').addEventListener('click', cancelRoom);
window.addEventListener('storage', () => { if ($('scr-lobby').classList.contains('active')) renderBoard(); });
openLobby();
})();
</script>
